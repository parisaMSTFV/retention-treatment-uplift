name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: External adapter smoke (network-free fixture)
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: python -m unittest tests.test_criteo -v
      - name: Check public files
        run: python scripts/check_sensitive.py
