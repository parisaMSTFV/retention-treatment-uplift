name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MKL_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      UV_VERSION: "0.12.15"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked environment tool
        run: python -m pip install "uv==$UV_VERSION"
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --no-install-project
      - name: Build wheel
        run: uv run --no-sync python -m build --wheel --no-isolation
      - name: Install wheel
        run: uv pip install --python .venv/bin/python --no-deps --force-reinstall dist/*.whl
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test with coverage gate
        env:
          MPLCONFIGDIR: /tmp/matplotlib
        run: |
          uv run --no-sync coverage run -m unittest discover -s tests -v
          uv run --no-sync coverage report --fail-under=85
      - name: Smoke installed wheel outside repository
        run: |
          smoke_root="$(mktemp -d)"
          cd "$smoke_root"
          "$GITHUB_WORKSPACE/.venv/bin/retention-uplift" \
            --customers 1600 \
            --project-root "$smoke_root/run"
      - name: Check public files
        run: uv run --no-sync python scripts/check_sensitive.py
